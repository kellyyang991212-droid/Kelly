name: Deploy travel journal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: '1'
  EXPO_BASE_PATH: /${{ github.event.repository.name }}
  # Public browser configuration for the Kelly website. Repository variables can override it.
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://ldozwogqktqnnlmqiept.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || (!vars.EXPO_PUBLIC_SUPABASE_URL && 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxkb3p3b2dxa3Rxbm5sbXFpZXB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNTA2MTMsImV4cCI6MjExMDcyNjYxM30.S-yt5GLlToEf0tKgB1Sa0FkN636j4J42uTE0AyZ9W1E') || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Run domain tests
        run: pnpm test
      - name: Verify shared-trip backend
        run: node scripts/verify-shared-trips.mjs
      - name: Export Expo web app
        run: pnpm export:web
      - name: Verify Pages paths and prepare static output
        run: node scripts/prepare-pages.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
